# Stack chay o MAY CA NHAN. Moi cong deu gan vao 127.0.0.1 nen khong lo ra mang LAN:
# may khac trong cung wifi khong truy cap duoc. Muon demo cho may khac thi bo "127.0.0.1:".
#
# KHONG dat container_name co dinh: dat thi hai ban sao cua du an khong the chay cung luc
# (Docker bao "container name already in use"), va ai da co container trung ten se gap
# loi kho hieu ngay lenh dau tien. De Docker tu dat ten theo <project>-<service>-1.
name: nhagiakim

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Thieu MSSQL_SA_PASSWORD - copy .env.example thanh .env}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # API chi duoc khoi dong khi SQL Server THAT SU tra loi query, khong phai chi mo cong.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=NhaGiaKim;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      # Trong container thi tu migrate + seed la dung: database bat dau tu rong.
      Database__MigrateOnStartup: "true"
      Jwt__Key: ${JWT_KEY:?Thieu JWT_KEY - toi thieu 32 ky tu}
      Jwt__Issuer: NhaGiaKim.Api
      Jwt__Audience: NhaGiaKim.Client
      Jwt__ExpiryMinutes: "60"
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:?Thieu SEED_ADMIN_PASSWORD}
      # Bat Swagger de cham bai / demo. Trien khai that thi dat false.
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
      # Dat Information de THAY CAU SQL that ma EF Core sinh ra (dung khi quay video demo).
      # Mac dinh Warning cho log khoi ngap.
      Serilog__MinimumLevel__Override__Microsoft.EntityFrameworkCore.Database.Command: ${SQL_LOG_LEVEL:-Warning}
      # Frontend va API dung chung origin qua nginx nen khong can CORS,
      # van khai bao phong truong hop goi API truc tiep o cong 5080.
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:8080}
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"
    volumes:
      - uploads:/app/wwwroot/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"

volumes:
  mssql-data:
  uploads:
