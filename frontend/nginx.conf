server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nen cac file text, giup bundle 1.2MB nhe di dang ke.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Chan trinh duyet doan lai kieu noi dung.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Asset co hash trong ten -> cache lau duoc.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html KHONG duoc cache, neu khong nguoi dung se dinh ban cu sau khi deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # API va file tai len di qua day -> cung origin voi SPA, khong can CORS.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;   # phai lon hon gioi han 20MB cua file PDF
    }

    location /uploads/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        client_max_body_size 25m;
    }

    location /swagger/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # SPA: moi duong dan khac deu tra index.html de React Router tu dinh tuyen.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
