<style type="text/tailwindcss">
/* ===== TOKEN CỦA DỰ ÁN, xếp theo vai =====
   Nguồn: frontend/src/index.css (--color-ink, --color-sand, --color-gold, --color-gold-dark,
   --font-display). Dự án mới chỉ khai 4 màu + 1 font, nên ở đây xếp chúng vào vai
   (primary / background / surface / foreground / muted / border) đúng như bước dựng sẽ làm.
   Không thêm mã màu nào ngoài khối này. */
:root {
  color-scheme: light;

  --app-font: "Inter", ui-sans-serif, system-ui, sans-serif;
  --display-font: "Playfair Display", Georgia, serif;

  /* Màu nhấn = vàng của brand.
     CHỮ TRÊN NỀN NHẤN LÀ MỰC, KHÔNG PHẢI TRẮNG: trắng trên #c8973f chỉ 2.64:1 (trượt AA),
     mực trên vàng 6.5:1. Đây là lỗi Ant Design mặc định sẽ mắc ở trang quản trị. */
  --primary: #c8973f;
  --primary-hover: #a97a28;
  --primary-foreground: #1b1b1f;
  --primary-light: #c8973f1a;

  --background: #f6f1e7;      /* nền kem của brand */
  --surface: #ffffff;
  --foreground: #1b1b1f;      /* mực */
  --muted: #6f6a60;           /* xám ngả ấm cho hợp nền kem, 4.9:1 trên surface */
  --border: #ece5d7;
  --border-strong: #ddd3c0;

  --surface-overlay: #ffffff;
  --elevation-popover: 0 10px 15px -3px rgb(27 27 31 / .10), 0 4px 6px -4px rgb(27 27 31 / .10);
  --elevation-modal: 0 20px 25px -5px rgb(27 27 31 / .12), 0 8px 10px -6px rgb(27 27 31 / .12);

  --border-focus: var(--primary);
  --ring-focus: color-mix(in srgb, var(--primary) 35%, transparent);

  --success: #15803d;  --success-bg: #dcfce7;
  --warning: #b45309;  --warning-bg: #fef3c7;
  --danger:  #b91c1c;  --danger-bg:  #fee2e2;
  --info:    #1d4ed8;  --info-bg:    #dbeafe;

  --radius: 12px;
}

/* Nấc Xám: CHỈ đổi màu nhấn và màu trạng thái sang xám.
   Nền, viền, chữ, bo góc, font giữ nguyên token — bật Màu lên là ra đúng bản dựng. */
:root[data-mau="xam"] {
  --primary: #3f3b35;
  --primary-hover: #56514a;
  --primary-foreground: #ffffff;
  --primary-light: #3f3b350f;
  --border-focus: #3f3b35;
  --ring-focus: #3f3b3540;
  --success: #44403c; --success-bg: #e7e5e4;
  --warning: #44403c; --warning-bg: #e7e5e4;
  --danger:  #44403c; --danger-bg:  #e7e5e4;
  --info:    #44403c; --info-bg:    #e7e5e4;
}

@theme inline {
  --font-sans: var(--app-font);
  --font-display: var(--display-font);
  --color-background: var(--background);
  --color-surface: var(--surface);
  --color-foreground: var(--foreground);
  --color-muted: var(--muted);
  --color-border: var(--border);
  --color-border-strong: var(--border-strong);
  --color-primary: var(--primary);
  --color-primary-hover: var(--primary-hover);
  --color-primary-foreground: var(--primary-foreground);
  --color-primary-light: var(--primary-light);
  --color-success: var(--success); --color-success-bg: var(--success-bg);
  --color-warning: var(--warning); --color-warning-bg: var(--warning-bg);
  --color-danger: var(--danger);   --color-danger-bg: var(--danger-bg);
  --color-info: var(--info);       --color-info-bg: var(--info-bg);
  --radius-card: var(--radius);
  --shadow-popover: var(--elevation-popover);
  --shadow-modal: var(--elevation-modal);
}

body { font-family: var(--app-font); background: var(--background); color: var(--foreground); }
.font-display { font-family: var(--display-font); }

/* Khung đánh số khối — chỉ của wireframe, không vào bản dựng */
[data-wf-block] { position: relative; outline: 1px dashed color-mix(in srgb, var(--foreground) 14%, transparent); outline-offset: 0; }
[data-wf-block]::before {
  content: attr(data-wf-block);
  position: absolute; top: 0; left: 0; z-index: 40;
  font: 600 10px/1 var(--app-font); letter-spacing: .02em;
  padding: 3px 5px; border-radius: 0 0 6px 0;
  background: var(--foreground); color: var(--background);
}
[data-wf-block][data-wf-block-out]::before { top: -15px; left: -1px; border-radius: 6px 6px 0 0; }
.wf-plain [data-wf-block] { outline: none; }
.wf-plain [data-wf-block]::before { display: none; }

/* Ảnh giữ chỗ: khối có tỉ lệ thật của bìa sách 2:3 */
.ph { background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--foreground) 6%, transparent) 0 8px, transparent 8px 16px), var(--surface); }

input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible {
  outline: 2px solid var(--border-focus); outline-offset: 2px;
}
</style>

        </ul>`}
      </section>`).join('')}
  </div>`;
  return khungAdmin(`
    <div data-wf-block="24"><h1 class="font-display text-2xl">Đơn đặt hàng</h1><p class="mt-1 text-[14px] text-muted">Nhóm theo việc cần làm</p></div>
    ${thanhLoc()}
    ${than}`);
}

// ---------------------------------------------------------------- vẽ
function veLyDo() {
  const bien = ['d','e'].includes(S.v);
  const ds = bien ? LY_DO_DE[S.man][S.v] : LY_DO[S.man][S.v];
  const laKhuyen = !bien && S.v === KHUYEN[S.man];
  const ten = bien ? `Biến thể ${S.v.toUpperCase()}` : `Phương án ${S.v.toUpperCase()}`;
  document.getElementById('ly-do').innerHTML = `
    <div class="rounded-card border border-border-strong bg-surface p-4">
      <p class="flex flex-wrap items-center gap-2 font-medium">
        ${ten}
        ${laKhuyen ? `<span class="rounded-full bg-primary px-2 py-0.5 text-[12px] font-semibold text-primary-foreground">Khuyên dùng</span>` : ''}
      </p>
      <ul class="mt-2 grid gap-1 text-[14px] text-muted">
        ${ds.map((t,i) => `<li class="flex gap-2"><i data-lucide="${['target','replace','scale'][i]}" class="mt-0.5 size-4 shrink-0"></i><span>${t}</span></li>`).join('')}
      </ul>
    </div>`;
}

function veSan() {
  const el = document.getElementById('san');
  if (S.kho === 'mobile' && !S.frame) {
    const p = new URLSearchParams(location.search);
    p.set('frame','1'); p.set('kho','desktop');
    el.innerHTML = `<div class="grid place-items-center py-4">
      <div class="overflow-hidden rounded-[28px] border-[10px] border-foreground/85 shadow-modal">
        <iframe src="?${p}" width="375" height="812" class="block bg-background"></iframe>
      </div>
      <p class="mt-3 text-[13px] text-muted">375 × 812 — media query chạy thật</p>
    </div>`;
    return;

  const bien = ['d','e'].includes(S.v) ? S.v : null;
  const v = bien ? KHUYEN[S.man] : S.v;
  if (S.man === 'landing') {
    el.innerHTML = v === 'a' ? landingA() : v === 'b' ? landingB() : landingC();

    el.innerHTML = v === 'a' ? donA(bien) : v === 'b' ? donB() : donC();

function veNut() {
  document.querySelectorAll('[data-set]').forEach(b => {
    const k = b.dataset.set, val = b.dataset.val;
    b.setAttribute('aria-pressed', String(S[k] === val));
    b.onclick = () => go(k, val);
  });
  document.getElementById('toggle-so').onclick = () => go('so', S.so ? '0' : '1');
  document.getElementById('toggle-so').textContent = S.so ? 'Ẩn số khối' : 'Hiện số khối';
  // Trạng thái chỉ có nghĩa ở màn đơn hàng
  document.querySelectorAll('[data-set="tt"]').forEach(b => b.disabled = S.man === 'landing');

/** Số khối không được đè chữ/icon nằm ngay góc trên trái của khối.
 *  elementFromPoint một điểm là chưa đủ: chữ có thể bắt đầu lệch vài px khỏi điểm đo.
 *  Đo thẳng hình chữ nhật của huy hiệu rồi so với hình chữ nhật của từng đoạn chữ con. */
function placeBlockNumbers() {
  const RONG = 22, CAO = 15;
  document.querySelectorAll('[data-wf-block]').forEach(el => {
    el.removeAttribute('data-wf-block-out');
    const r = el.getBoundingClientRect();
    const huyHieu = { l: r.left, t: r.top, r: r.left + RONG, b: r.top + CAO };

    const giao = (b) => b.width > 0 && b.height > 0
      && b.left < huyHieu.r && b.right > huyHieu.l
      && b.top < huyHieu.b && b.bottom > huyHieu.t;

    let de = false;
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    for (let n = walker.nextNode(); n && !de; n = walker.nextNode()) {
      if (!n.nodeValue.trim()) continue;
      const rg = document.createRange();
      rg.selectNodeContents(n);
      for (const b of rg.getClientRects()) if (giao(b)) { de = true; break; }
    }
    if (!de) {
      for (const svg of el.querySelectorAll('svg, img')) {
        if (giao(svg.getBoundingClientRect())) { de = true; break; }
      }
    }
    if (de) el.setAttribute('data-wf-block-out', '');
  });
}

document.documentElement.dataset.mau = S.mau;
if (!S.so) document.body.classList.add('wf-plain');
if (S.frame) document.getElementById('bar').remove(), document.getElementById('ly-do').remove();
veNut(); veLyDo(); veSan();

// createIcons() chỉ thay <i data-lucide> có lúc gọi. Phải có điều kiện i[data-lucide],
// vì svg vẽ xong vẫn mang data-lucide — gọi thẳng trong observer là treo trang.
new MutationObserver(() => { if (document.querySelector('i[data-lucide]')) lucide.createIcons(); })
  .observe(document.body, { childList: true, subtree: true });
lucide.createIcons();
requestAnimationFrame(placeBlockNumbers);
addEventListener('resize', placeBlockNumbers);
